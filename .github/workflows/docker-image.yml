name: Docker image

# Construye la imagen etiquetada con el commit. Todavía no publica ni despliega.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t buildshield-core:${{ github.sha }} .
