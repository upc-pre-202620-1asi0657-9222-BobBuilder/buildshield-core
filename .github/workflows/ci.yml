name: CI

# Compila, ejecuta pruebas unitarias y de integración (Testcontainers),
# valida la arquitectura con ArchUnit y verifica la cobertura con JaCoCo.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: ./mvnw -B verify

      - name: Checksum verified JAR
        shell: bash
        run: |
          cd target
          shopt -s nullglob
          jars=(buildshield-core-*.jar)
          test "${#jars[@]}" -eq 1
          sha256sum "${jars[0]}" > "${jars[0]}.sha256"

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: |
            target/buildshield-core-*.jar
            target/buildshield-core-*.jar.sha256
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/verification/
          if-no-files-found: ignore
