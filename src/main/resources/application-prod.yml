# Perfil prod: toda la configuración sensible llega por variables de entorno.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

buildshield:
  security:
    jwt-public-key: ${BUILDSHIELD_JWT_PUBLIC_KEY}
    jwt-private-key: ${BUILDSHIELD_JWT_PRIVATE_KEY}
  iam:
    password-reset-url: ${BUILDSHIELD_PASSWORD_RESET_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
