spring:
  application:
    name: buildshield-core
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/api-docs

buildshield:
  security:
    issuer: buildshield-core
  iam:
    # Duración de la sesión renovable y del enlace de recuperación de contraseña.
    refresh-token-ttl: P7D
    password-reset-ttl: PT30M
