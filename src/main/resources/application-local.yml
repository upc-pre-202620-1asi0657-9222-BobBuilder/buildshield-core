# Perfil local: usa la infraestructura de buildshield-infra (docker compose).
# Las credenciales solo llegan por variables de entorno.
spring:
  datasource:
    url: jdbc:postgresql://${CORE_DB_HOST:localhost}:${CORE_DB_PORT:5432}/${CORE_DB_NAME:core_db}
    username: ${CORE_DB_USER}
    password: ${CORE_DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

buildshield:
  security:
    # Claves RSA en PEM (ver README: cómo generarlas con openssl).
    jwt-public-key: ${BUILDSHIELD_JWT_PUBLIC_KEY}
    jwt-private-key: ${BUILDSHIELD_JWT_PRIVATE_KEY}
  iam:
    password-reset-url: ${BUILDSHIELD_PASSWORD_RESET_URL:http://localhost:4200/restablecer-contrasena}
